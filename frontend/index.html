<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <style>html{background:var(--cream,#122f12)}body{margin:0;min-height:100vh;min-height:100dvh}html:has(.landing-bootstrap),body:has(.landing-bootstrap){background:#122f12}#root{min-height:100vh;min-height:100dvh}</style>
    <meta name="theme-color" content="#122F12" />
    <meta name="description" content="دکتر گوپت؛ مرور و انتخاب محصولات سگ، گربه و پرنده و مطالعهٔ اطلاعات دارویی و داروخانه‌ها." />
    <link rel="icon" href="/brand/logo.webp" type="image/webp" />
    <link rel="preload" href="/fonts/vazirmatn/vazirmatn-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      if (location.pathname === '/') {
        for (const image of [
          { href: '/brand/landing-family-mobile-720.webp', media: '(max-width: 760px)', srcset: '/brand/landing-family-mobile-480.webp 480w, /brand/landing-family-mobile-720.webp 720w' },
          { href: '/brand/landing-family-1600.webp', media: '(min-width: 761px)', srcset: '/brand/landing-family-640.webp 640w, /brand/landing-family-1600.webp 1600w' },
        ]) {
          const preload = document.createElement('link');
          Object.assign(preload, { rel: 'preload', as: 'image', type: 'image/webp', href: image.href, media: image.media, imageSrcset: image.srcset, imageSizes: '100vw', fetchPriority: 'high' });
          document.head.appendChild(preload);
        }
      }
    </script>
    <link rel="stylesheet" href="/src/styles/loading.css" />
    <script>document.documentElement.dataset.bootPage = location.pathname === '/' ? 'landing' : 'page';</script>
    <title>دکتر گوپت</title>
  </head>
  <body>
    <div id="root">
      <!-- Initial bootstrap preview; React replaces it after readiness and the landing minimum. -->
      <div class="landing-bootstrap" role="status" aria-busy="true" aria-label="در حال بارگذاری سایت">
        <div class="landing-bootstrap__mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="64" height="64" fill="currentColor"><ellipse cx="15" cy="24" rx="7" ry="9" transform="rotate(-25 15 24)"/><ellipse cx="28" cy="15" rx="7" ry="9"/><ellipse cx="43" cy="17" rx="7" ry="9" transform="rotate(15 43 17)"/><ellipse cx="52" cy="30" rx="6" ry="8" transform="rotate(35 52 30)"/><path d="M14 47c0-9 10-20 18-20s20 11 20 20c0 12-13 7-19 7s-19 5-19-7Z"/></svg>
          <span class="landing-bootstrap__orbit"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        </div>
      </div>
      <div class="page-bootstrap loading-wireframe" role="status" aria-busy="true">
        <span class="loading-wireframe__status">در حال آماده‌سازی صفحه…</span>
        <div class="loading-wireframe__body" aria-hidden="true"><div class="loading-wireframe__heading"><span class="loading-wireframe__line loading-wireframe__line--short"></span><span class="loading-wireframe__line"></span></div><div class="loading-wireframe__grid"><div class="loading-wireframe__card"><span class="loading-wireframe__media"></span><span class="loading-wireframe__line"></span><span class="loading-wireframe__line loading-wireframe__line--short"></span></div><div class="loading-wireframe__card"><span class="loading-wireframe__media"></span><span class="loading-wireframe__line"></span><span class="loading-wireframe__line loading-wireframe__line--short"></span></div></div></div>
      </div>
    </div>
    <script>document.documentElement.dataset.bootStartedAt = String(performance.now());</script>
    <noscript>
      <style>#root { display: none; }</style>
      <p>برای نمایش فروشگاه، جاوااسکریپت مرورگر را فعال کنید.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
